# Automatic requirement checks for Hour Vault (same mechanism as CE Compass's rules/checks.yml).
#
# A template in requirements.json is "verified" only when EVERY number it contains (ojtTarget, and
# classroomTarget when it is above 0) is matched by a fact below AND the pattern is found on the official
# source page with the same number. Runs daily on GitHub Actions. If a board edits its page so a number no
# longer matches, the template drops to "needs_review" the same day and an issue is opened.
#
# Fields: ojt -> ojtTarget, classroom -> classroomTarget. `scale: N` multiplies the captured number
# (Oregon states 3,850 commercial + 3,850 residential; Minnesota states hours per year).
# Patterns are regular expressions matched case-insensitively against the page text, whitespace collapsed.

- set: TX plumbing
  sources:
    - https://tsbpe.texas.gov/wp-content/uploads/forms/TSBPE_JourneymanPlumberExamationApplication.pdf
    - https://tsbpe.texas.gov/license-types/journeyman
  facts:
    - field: ojt
      pattern: 'at least (?P<n>[\d,]+) hours of experience working in the trade of plumbing'
    - field: classroom
      pattern: 'take the (?P<n>\d+)-hour classroom training'

- set: LA plumbing
  sources:
    - https://legis.la.gov/Legis/ViewDocument.aspx?d=1320642
  facts:
    - field: ojt
      pattern: 'at least (?P<n>[\d,]+) hours of on-the-job training'

- set: OR plumbing
  sources:
    - https://www.oregon.gov/bcd/Formslibrary/2571.pdf
  facts:
    - field: ojt
      scale: 2
      pattern: 'proof of (?P<n>[\d,]+) hours lawful commercial and [\d,]+ hours lawful residential'
    - field: classroom
      pattern: 'at least (?P<n>[\d,]+) hours of academic classroom training'
    - field: cat:Commercial
      pattern: 'proof of (?P<n>[\d,]+) hours lawful commercial'
    - field: cat:Residential
      pattern: 'hours lawful commercial and (?P<n>[\d,]+) hours lawful residential'

- set: MN plumbing
  sources:
    - https://www.revisor.mn.gov/rules/4716.0020/
  facts:
    - field: ojt
      scale: 4
      pattern: 'one year of practical plumbing experience consists of at least (?P<n>[\d,]+) hours'
    - field: cat:Water Supply
      pattern: 'water distribution system installation, (?P<n>2,000) hours'
    - field: cat:Drainage/Waste/Vent
      pattern: 'drain, waste, and vent system installation, (?P<n>2,000) hours'
    - field: cat:Fixtures
      pattern: 'fixture installation, (?P<n>1,000) hours'

- set: WA plumbing
  sources:
    - https://lni.wa.gov/licensing-permits/plumbing/plumber-certification/
  facts:
    - field: ojt
      pattern: 'four years or more \(at least (?P<n>[\d,]+) hours\) working as a plumber trainee'
    - field: cat:Commercial
      pattern: 'two years or more \(at least (?P<n>[\d,]+) hours\) must be spent working in commercial or industrial'

- set: ID plumbing
  sources:
    - https://dopl.idaho.gov/wp-content/uploads/2024/09/PLB-Journeyman-Application.pdf
  facts:
    - field: ojt
      pattern: 'verifying (?P<n>[\d,]+) hours of supervised plumbing installation work'
    - field: classroom
      pattern: 'completed (?P<n>[\d,]+) hours of instruction at a board approved plumbing'

- set: CO plumbing
  sources:
    - https://dpo.colorado.gov/Plumbing/Applications
  facts:
    - field: ojt
      pattern: 'journeyworker plumber.{0,200}?(?:four|4) years \((?P<n>[\d,]+) hours\) of practical experience'

- set: UT plumbing
  sources:
    - https://commerce.utah.gov/dopl/plumbing/apply-for-a-journeyman-plumber-license/
  facts:
    - field: ojt
      pattern: '(?P<n>[\d,]+) hours of licensed plumbing experience'
    - field: classroom
      pattern: 'apprenticeship education program \((?P<n>[\d,]+) classroom hours\)'

- set: MA plumbing
  sources:
    - https://www.law.cornell.edu/regulations/massachusetts/248-CMR-11-02
  facts:
    - field: ojt
      pattern: 'practical work experience that totals no less than (?P<n>[\d,]+) clock hours as a licensed apprentice'
    - field: classroom
      pattern: '(?P<n>[\d,]+) clock hours of plumbing and gasfitting theory'

- set: CO plumbing residential
  sources:
    - https://dpo.colorado.gov/Plumbing/Applications
  facts:
    - field: ojt
      pattern: 'residential plumber[^.]{0,80}?(?:two|2) years \((?P<n>[\d,]+) hours\) of practical experience'

- set: CO plumbing master
  sources:
    - https://dpo.colorado.gov/Plumbing/Applications
  facts:
    - field: ojt
      pattern: 'five full-time years \((?P<n>[\d,]+) hours\) of practical experience'

- set: WA plumbing residential-specialty
  sources:
    - https://lni.wa.gov/licensing-permits/plumbing/plumber-certification/
  facts:
    - field: ojt
      pattern: '(?:3|three) years or more \(at least (?P<n>[\d,]+) hours\) working in the specialty under supervision of a certified residential or journey level plumber'

- set: WA plumbing residential-service
  sources:
    - https://lni.wa.gov/licensing-permits/plumbing/plumber-certification/
  facts:
    - field: ojt
      pattern: 'two years or more \(at least (?P<n>[\d,]+) hours\) working as a plumber trainee under the supervision of a journey level, residential specialty, or residential service'

- set: AK plumbing
  sources:
    - https://dol.alaska.gov/lss/mi-license-req.html
  facts:
    - field: ojt
      pattern: '(?P<n>[\d,]+) hours of legally obtained work in installation of commercial/residential plumbing'

- set: TX plumbing tradesman-limited
  sources:
    - https://tsbpe.texas.gov/license-types/tradesman/
  facts:
    - field: ojt
      pattern: 'at least (?P<n>[\d,]+) hours of experience working in the plumbing trade'
    - field: classroom
      pattern: 'completed a (?P<n>\d+)-hour training course'

- set: ME plumbing
  sources:
    - https://legislature.maine.gov/statutes/32/title32sec3501.html
  facts:
    - field: ojt
      pattern: 'at least 2 years with (?P<n>[\d,]+) hours of work in the field of plumbing installations as a licensed trainee'

- set: NH plumbing
  sources:
    - https://www.nhes.nh.gov/elmi/products/licertocc/documents/plumbjou.pdf
  facts:
    - field: ojt
      pattern: 'four-year apprenticeship in plumbing \((?P<n>[\d,]+) hours\)'
